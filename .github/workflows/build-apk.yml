name: Build Android APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
# Secrets to add in GitHub (Settings > Secrets and variables > Actions):
#   PUBLIC_KEY_JWK        the PUBLIC key from the Key Generator (required for the inventory app)
#   OWNER_WHATSAPP        optional, digits with country code
#   DEBUG_KEYSTORE_BASE64 optional but strongly advised: keeps the signing key (and so the Device ID) stable. See docs/LICENSING.md
jobs:
  inventory-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Fixed signing key
        env: { KS: "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore; else echo "::warning::DEBUG_KEYSTORE_BASE64 not set: Device IDs can change between builds"; fi
      - name: License public key
        env: { PUBLIC_KEY_JWK: "${{ secrets.PUBLIC_KEY_JWK }}", OWNER_WHATSAPP: "${{ secrets.OWNER_WHATSAPP }}" }
        run: node tools/set-public-key.js
      - run: npm install
      - run: npx cap add android
      - name: Harden manifest
        run: sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
      - run: npm run android:sync
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: innovista-inventory-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
  keygen-apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: keygen } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - run: sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
      - run: npm run android:sync
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: innovista-keygen-apk, path: keygen/android/app/build/outputs/apk/debug/app-debug.apk }
