<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="theme-color" content="#e8502e"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INNOVISTA Inventory Management</title>
<style>
:root{--bg:#f1f1f3;--card:#fff;--tx:#14141a;--mu:#80808c;--pr:#5b6cf0;--pr2:#8a98f8;--gr:#2e8b62;--rd:#d24545;--bd:#e7e7ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101014;--card:#1b1b22;--tx:#f2f2f6;--mu:#9a9aa8;--bd:#2b2b35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101014;--card:#1b1b22;--tx:#f2f2f6;--mu:#9a9aa8;--bd:#2b2b35;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:480px;margin:auto;padding:14px 14px 90px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.grid .card{margin:0}
.big{font-size:22px;font-weight:700;margin-top:6px}.mu{color:var(--mu);font-size:13px}
.hero{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0}.hero .mu{color:#e6e9ff}
h2{margin:0 0 8px;font-size:17px}
button,input,select{font:inherit;color:var(--tx)}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);margin:4px 0 8px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--rd)}.btn.w{width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.bars{display:flex;gap:14px;align-items:flex-end;height:120px;margin-top:8px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mu)}
.bars i{display:block;border-radius:10px 10px 4px 4px;margin-top:4px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:480px;width:100%}nav button{flex:1;background:none;border:0;padding:12px 2px;color:var(--mu);font-size:12px;cursor:pointer}nav button.on{color:var(--pr);font-weight:700}
.bad{color:var(--rd)}.ok{color:var(--gr)}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:9}
#modal .box{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px;max-height:85vh;overflow:auto}
.lock{max-width:340px;margin:20vh auto;text-align:center}
.tg{display:flex;justify-content:space-between;align-items:center}

:root{--pr:#e8502e;--pr2:#f7924f;--xl:#1d6f42;--xl2:#e8f3ec;--ln:#d6d9de;--rn:#f0f1f4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--xl:#1f7a4a;--xl2:#18261e;--ln:#34343f;--rn:#24242c}}
:root[data-theme="dark"]{--xl:#1f7a4a;--xl2:#18261e;--ln:#34343f;--rn:#24242c}
body{background:radial-gradient(900px 300px at 50% -80px,#e8502e22,transparent),var(--bg)}
.card{box-shadow:0 2px 10px #0000000d;border-radius:16px}
.hero{box-shadow:0 8px 22px #e8502e40}
.sh{overflow-x:auto;border:1px solid var(--ln);border-radius:12px;background:var(--card);margin-bottom:12px}
table.sheet{border-collapse:collapse;width:100%;font-size:13px;min-width:100%}
table.sheet td,table.sheet th{border:1px solid var(--ln);padding:7px 8px;white-space:nowrap}
table.sheet tr.ab th{background:var(--rn);color:var(--mu);font-weight:400;font-size:11px;padding:2px;text-align:center}
table.sheet tr.hd th{background:var(--xl);color:#fff;font-weight:600;text-align:left}
table.sheet td.rn,table.sheet th.rn{background:var(--rn);color:var(--mu);text-align:center;width:30px;font-size:11px}
table.sheet tr:nth-child(even) td:not(.rn){background:var(--xl2)}
table.sheet td.r,table.sheet th.r{text-align:right;font-variant-numeric:tabular-nums}
table.sheet tr.ft td{font-weight:700;background:var(--rn)!important;border-top:2px solid var(--xl)}
table.sheet input{width:76px;margin:0;padding:4px 6px;border-radius:6px;text-align:right;background:var(--card);border:1px solid var(--pr)}
.ttl{display:flex;align-items:center;gap:8px;margin:4px 0 8px;font-weight:700}.ttl:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--pr)}
nav{box-shadow:0 -4px 18px #00000014}nav button span{display:block;font-size:19px;line-height:1.2}
nav button.on{color:var(--pr)}

.tile{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);margin-top:10px;cursor:pointer}
.tile b{display:block}.tile .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#e8502e1f;flex:none}.tile .ch{margin-left:auto;color:var(--mu)}
.tile.danger{border-color:#d2454566}.tile.danger .ic{background:#d2454522}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;background:#d2454522;color:var(--rd);font-weight:600}
input[type=file]{padding:8px}textarea{background:var(--bg)}
html,body{overscroll-behavior-y:contain}#ptr{position:fixed;top:0;left:0;right:0;height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;color:var(--mu);font-size:13px;z-index:8;background:linear-gradient(var(--card),transparent)}#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;transition:.3s;z-index:12;pointer-events:none}#toast.on{opacity:.95}.arr{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--pr);cursor:pointer;font-size:13px;box-shadow:0 2px 8px #0000001a;transition:transform .3s}.arr.c{transform:rotate(180deg)}.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s ease}.fold.c{grid-template-rows:0fr}.fold>div{overflow:hidden;min-height:0}
@media(min-width:700px){body{font-size:16px}#app{max-width:860px;padding:22px 22px 100px}nav div{max-width:860px}.grid{grid-template-columns:repeat(3,1fr)}table.sheet{font-size:14.5px}table.sheet td,table.sheet th{padding:10px 14px}#modal{align-items:center}#modal .box{border-radius:20px;max-width:540px}.lock{margin-top:14vh}}
@media(min-width:1100px){#app{max-width:1120px}nav div{max-width:1120px}table.sheet{font-size:15px}}
@media(max-width:360px){.big{font-size:19px}table.sheet{font-size:12px}table.sheet td,table.sheet th{padding:6px}}
.sh{max-height:70vh;overflow:auto;-webkit-overflow-scrolling:touch}
table.sheet tr.ab th{position:sticky;top:0;z-index:3;height:20px;line-height:16px;background:var(--rn)}
table.sheet tr.hd th{position:sticky;top:20px;z-index:3}
table.sheet td.rn,table.sheet th.rn{position:sticky;left:0;z-index:2}
table.sheet tr.ab th:first-child,table.sheet tr.hd th.rn{z-index:4}
table.sheet tbody tr:hover td:not(.rn){background:#e8502e14!important}
table.sheet tr.ft td{position:sticky;bottom:0;z-index:2}
table.sheet input:focus{outline:2px solid var(--pr);outline-offset:0}
.ttl .arr{margin-left:auto;width:32px;height:32px}.ttl span{flex:1}</style></head><body>

const logo=(n)=>'<img src="'+LOGO+'" alt="INNOVISTA" style="width:'+n+'px;height:'+n+'px;border-radius:50%">';
const iso=d=>d.toISOString().slice(0,10);
const nextDay=s=>{const d=new Date(s+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+1);return iso(d)};
const def=()=>({cur:iso(new Date()),products:[],customers:[],sales:[],pays:[],days:{},
 cfg:{lock:false,pw:'1234',shop:'INNOVISTA',note:'Inventory Management',low:10,near:30,
 cards:{sales:'Total sales',units:'Units sold',stock:'Stock remaining',recv:'Payments received',due:'Total outstanding'},hide:{}}});
let S;S=null;for(const k of [K,K+'_bak']){try{const j=JSON.parse(localStorage.getItem(k));if(j&&j.products&&j.cfg){S=j;break}}catch(e){}}if(!S)S=def();
let lastSave=null;const save=()=>{try{const j=JSON.stringify(S);localStorage.setItem(K,j);localStorage.setItem(K+'_bak',j);S.savedAt=new Date().toISOString();lastSave=new Date();saveUI();if(window.DBX)DBX.queue(S)}catch(e){}};
const saveUI=()=>{try{localStorage.setItem(K+'_ui',JSON.stringify({tab,vd,sub,bill}))}catch(e){}};
let tab='dash',vd=S.cur,unlocked=!S.cfg.lock,sub=null,bill=null;
try{const u=JSON.parse(localStorage.getItem(K+'_ui'));if(u){if(['dash','inv','sales','cust','more'].includes(u.tab))tab=u.tab;if(/^\d{4}-\d\d-\d\d$/.test(u.vd||''))vd=u.vd;if(u.sub=='admin'||S.customers.some(c=>c.id==u.sub))sub=u.sub;if(u.bill&&u.bill.items)bill=u.bill}}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const $=s=>document.querySelector(s),M=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2}),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pname=id=>(S.products.find(p=>p.id==id)||{name:'?'}).name;
const cname=id=>(S.customers.find(c=>c.id==id)||{name:'?'}).name;
const billsOf=c=>S.sales.filter(s=>s.cust==c),paysOf=c=>S.pays.filter(p=>p.cust==c);
const bal=c=>billsOf(c).reduce((a,s)=>a+s.total-s.paid,0)-paysOf(c).reduce((a,p)=>a+p.amt,0);
function modal(html){$('#mb').innerHTML=html;$('#modal').style.display='flex'}
function close(){$('#modal').style.display='none'}
$('#modal').onclick=e=>{if(e.target.id=='modal')close()};
function form(title,fields,cb,ok='Save'){
 modal('<h2>'+title+'</h2>'+fields.map(f=>'<label class="mu">'+f[1]+'</label>'+(f[2]=='select'?'<select id="f_'+f[0]+'">'+f[3]+'</select>':'<input id="f_'+f[0]+'" type="'+(f[2]||'text')+'" value="'+esc(f[3]||'')+'">')).join('')+
 '<div style="display:flex;gap:8px"><button class="btn s w" onclick="close()">Cancel</button><button class="btn w" id="okb">'+ok+'</button></div>');
 $('#okb').onclick=()=>{const v={};fields.forEach(f=>v[f[0]]=$('#f_'+f[0]).value);if(cb(v)!==false)close()}}
// ---------- lock ----------
function lockView(){
 $('#nav').innerHTML='';$('#app').innerHTML='<div class="lock card">'+logo(110)+'<h2>'+esc(S.cfg.shop)+'</h2><p class="mu">Enter password to open the app</p><input id="pw" type="password" placeholder="Password"><button class="btn w" id="go">Unlock</button><p class="bad" id="er"></p></div>';
 const go=()=>{if($('#pw').value===S.cfg.pw){unlocked=true;draw()}else $('#er').textContent='Wrong password'};
 $('#go').onclick=go;$('#pw').onkeydown=e=>{if(e.key=='Enter')go()}}
// ---------- calculations ----------
function dayData(d){
 const ss=S.sales.filter(s=>s.date==d),sold={};let units=0,total=0,recv=0;
 ss.forEach(s=>{total+=s.total;recv+=s.paid;s.items.forEach(i=>{sold[i.pid]=(sold[i.pid]||0)+i.qty;units+=i.qty})});
 S.pays.filter(p=>p.date==d).forEach(p=>recv+=p.amt);
 let rem;if(d==S.cur)rem=Object.fromEntries(S.products.map(p=>[p.id,p.stock]));else rem=(S.days[d]&&S.days[d].closing)||null;
 return{ss,sold,units,total,recv,rem}}
// ---------- views ----------
function dash(){
 const D=dayData(vd),c=S.cfg.cards,h=S.cfg.hide,due=S.customers.reduce((a,x)=>a+bal(x.id),0);
 const remTotal=D.rem?Object.values(D.rem).reduce((a,b)=>a+b,0):null;
 const cards=[['sales',M(D.total),vd],['units',D.units,vd],['stock',remTotal==null?'No record':remTotal,'end of day'],['recv',M(D.recv),vd],['due',M(due),'all shopkeepers']].filter(x=>!h[x[0]]);
 let hi=0,nl=0,lo=0;if(D.rem)S.products.forEach(p=>{const q=D.rem[p.id]||0;q<=S.cfg.low?lo++:q<=S.cfg.near?nl++:hi++});
 const mx=Math.max(hi,nl,lo,1);
 return '<div class="tg"><div style="display:flex;align-items:center;gap:10px">'+logo(44)+'<div><h2 style="margin:0">'+esc(S.cfg.shop)+'</h2><div class="mu">'+esc(S.cfg.note)+'</div></div></div><span class="mu">'+(vd==S.cur?'Open day':'Closed day')+'</span></div><br>'+
 '<input type="date" value="'+vd+'" onchange="vd=this.value||S.cur;draw()">'+
 '<div class="grid">'+cards.map((x,i)=>'<div class="card '+(i==0?'hero':'')+'"><div class="mu">'+esc(c[x[0]])+'</div><div class="big">'+x[1]+'</div><div class="mu">'+x[2]+'</div></div>').join('')+'</div>'+
 (h.stockinfo?'':'<div class="card"><h2>Stock info</h2><div class="mu">Active products</div><div class="big">'+S.products.length+'</div><div class="bars">'+
 [['High stock',hi,'#6e86ec'],['Near-low',nl,'#7fd3ee'],['Low stock',lo,'#b682d8']].map(b=>'<div>'+b[0]+'<br><b style="color:var(--tx);font-size:18px">'+b[1]+'</b><i style="height:'+(10+b[1]/mx*60)+'px;background:'+b[2]+'"></i></div>').join('')+'</div></div>')+
 '<div class="card"><h2>Products: sold and remaining</h2>'+(D.rem?S.products.map(p=>'<div class="row"><span>'+esc(p.name)+'</span><span class="mu">Sold '+(D.sold[p.id]||0)+' | Left <b style="color:var(--tx)">'+(D.rem[p.id]??0)+'</b></span></div>').join('')||'<div class="mu">No products yet</div>':'<div class="mu">No stock record for this date</div>')+'</div>'+
 '<div class="card"><h2>Bills on this date</h2>'+(D.ss.map(s=>'<div class="row"><span>'+esc(cname(s.cust))+'<br><span class="mu">'+s.items.map(i=>esc(pname(i.pid))+' x'+i.qty).join(', ')+'</span></span><span>'+M(s.total)+'</span></div>').join('')||'<div class="mu">No sales</div>')+'</div>'}
function inv(){
 return '<div class="tg"><h2>Inventory</h2><button class="btn" onclick="addProd()">+ Product</button></div>'+
 '<div class="card">'+(S.products.map(p=>'<div class="row"><span><b>'+esc(p.name)+'</b><br><span class="mu">Price '+M(p.price)+'</span></span><span style="text-align:right"><b class="'+(p.stock<=S.cfg.low?'bad':'')+'">'+p.stock+'</b><br><button class="btn s" onclick="addStock(\''+p.id+'\')">+ Stock</button></span></div>').join('')||'<div class="mu">Add your first product</div>')+'</div>'}
function addProd(){form('New product',[['n','Product name'],['p','Sale price','number'],['q','Opening stock','number','0']],v=>{if(!v.n.trim())return false;S.products.push({id:uid(),name:v.n.trim(),price:+v.p||0,stock:+v.q||0});save();draw()})}
function addStock(id){form('Add stock: '+esc(pname(id)),[['q','Quantity received','number']],v=>{const p=S.products.find(x=>x.id==id);p.stock+=+v.q||0;save();draw()})}
function sales(){
 if(!bill)bill={cust:'',items:[],paid:''};
 const opts='<option value="">Select shopkeeper</option>'+S.customers.map(c=>'<option value="'+c.id+'" '+(bill.cust==c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('');
 const tot=bill.items.reduce((a,i)=>a+i.qty*i.price,0);
 return '<h2>New bill ('+S.cur+')</h2><div class="card"><select onchange="bill.cust=this.value">'+opts+'</select><button class="btn s" onclick="addCust(1)">+ New shopkeeper</button></div>'+
 '<div class="card">'+(bill.items.map((i,k)=>'<div class="row"><span>'+esc(pname(i.pid))+' x '+i.qty+'</span><span>'+M(i.qty*i.price)+' <button class="btn s" onclick="bill.items.splice('+k+',1);draw()">x</button></span></div>').join('')||'<div class="mu">No items</div>')+
 '<br><button class="btn s" onclick="addItem()">+ Add item</button></div>'+
 '<div class="card"><div class="tg"><b>Bill total</b><b>'+M(tot)+'</b></div><label class="mu">Paid now</label><input type="number" value="'+bill.paid+'" oninput="bill.paid=this.value"><button class="btn w" onclick="saveBill()">Save bill</button></div>'}
function addItem(){if(!S.products.length)return form('No products',[],()=>true,'OK');
 form('Add item',[['p','Product','select',S.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' (stock '+p.stock+')</option>').join('')],['q','Quantity','number','1']],v=>{
 const p=S.products.find(x=>x.id==v.p),q=+v.q;const used=bill.items.filter(i=>i.pid==p.id).reduce((a,i)=>a+i.qty,0);
 if(!q||q+used>p.stock){alert('Not enough stock');return false}bill.items.push({pid:p.id,qty:q,price:p.price});draw()},'Add')}
function saveBill(){
 if(!bill.cust||!bill.items.length){alert('Select shopkeeper and add items');return}
 const total=bill.items.reduce((a,i)=>a+i.qty*i.price,0);
 bill.items.forEach(i=>S.products.find(p=>p.id==i.pid).stock-=i.qty);
 S.sales.push({id:uid(),date:S.cur,cust:bill.cust,items:bill.items,total,paid:+bill.paid||0});bill=null;save();vd=S.cur;tab='dash';draw()}
function addCust(fromBill){form('New shopkeeper',[['n','Name'],['ph','Phone']],v=>{if(!v.n.trim())return false;const c={id:uid(),name:v.n.trim(),phone:v.ph};S.customers.push(c);if(fromBill)bill.cust=c.id;save();draw()})}

// ---------- CSV import ----------
function parseCSV(t,sep){t=t.replace(/^\uFEFF/,'');const R=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch=='"')q=true;else if(ch==sep){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))R.push(r);r=[]}else c+=ch}
 r.push(c);if(r.some(x=>x.trim()))R.push(r);return R}
const num=v=>+String(v??'').replace(/,/g,'').trim();
let pend=[];
function impFile(el){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>impParse(String(rd.result));rd.readAsText(f);el.value=''}
function impParse(t){const first=t.split(/\r?\n/)[0]||'';const R=parseCSV(t,first.includes(';')&&!first.includes(',')?';':',');if(!R.length)return alert('Empty file');
 const h=R[0].map(x=>x.trim().toLowerCase());let ni=h.findIndex(x=>/name|product/.test(x)),pi=h.findIndex(x=>/price|rate/.test(x)),qi=h.findIndex(x=>/qty|quant|stock|count/.test(x)),ai=h.findIndex(x=>/amount|total/.test(x));
 let data=R.slice(1);if(ni<0||qi<0){ni=0;pi=1;qi=2;ai=3;data=R}
 pend=data.map(r=>{const qty=num(r[qi])||0;let price=pi>=0?num(r[pi]):NaN;const am=ai>=0?num(r[ai]):NaN;if(!(price>=0))price=(qty&&am>=0)?am/qty:0;return{name:(r[ni]||'').trim(),qty,price}}).filter(x=>x.name);
 if(!pend.length)return alert('No products found. Check the columns: Name, Price, Quantity, Amount');
 modal('<h2>Import '+pend.length+' products</h2><p class="mu">Prices are always updated. Matching is by product name. Choose how to treat quantity:</p><button class="btn w" onclick="applyImp(1)">Add quantity to current stock</button><br><br><button class="btn s w" onclick="applyImp(0)">Set quantity exactly (overwrite stock)</button><br><br><button class="btn s w" onclick="close()">Cancel</button>')}
function applyImp(add){pend.forEach(it=>{const p=S.products.find(x=>x.name.toLowerCase()==it.name.toLowerCase());if(p){p.price=it.price;p.stock=add?p.stock+it.qty:it.qty}else S.products.push({id:uid(),name:it.name,price:it.price,stock:it.qty})});pend=[];save();close();draw()}

  return{title:'All shopkeepers: balance summary',tables:[{h:['Shopkeeper','Phone','Total billed','Total paid','Balance due'],r,f:['Total','',b,p,b-p]}]}}

  let run=0,ta=0,tp=0;const r=ev.map(e=>{run+=e.a-e.p;ta+=e.a;tp+=e.p;return[e.d,e.t,e.a||'',e.p||'',run]});
  return{title:'Statement: '+c.name+(c.phone?' ('+c.phone+')':''),tables:[{h:['Date','Details','Bill','Paid','Balance'],r,f:['Total','',ta,tp,run]}]}}
 const ss=S.sales.filter(x=>x.date==k),pp=S.pays.filter(x=>x.date==k),ids=[...new Set([...ss.map(x=>x.cust),...pp.map(x=>x.cust)])];
 let tb=0,tp=0,tl=0;
 const r1=ids.map(id=>{const b=ss.filter(x=>x.cust==id),bill=b.reduce((a,x)=>a+x.total,0),paid=b.reduce((a,x)=>a+x.paid,0)+pp.filter(x=>x.cust==id).reduce((a,x)=>a+x.amt,0),bl=bal(id);tb+=bill;tp+=paid;tl+=bl;

 const pm={};ss.forEach(x=>x.items.forEach(i=>{const n=pname(i.pid);pm[n]=pm[n]||[0,0];pm[n][0]+=i.qty;pm[n][1]+=i.qty*i.price}));
 const r2=Object.entries(pm).map(e=>[e[0],e[1][0],e[1][1]]);
 let cb=0;const r3=S.customers.map(c=>{const b=bal(c.id);cb+=b;return[c.name,c.phone||'',b]});
 return{title:'Daily sales report: '+k,tables:[
  {name:'Sales by shopkeeper',h:['Shopkeeper','Items','Bill','Paid','Day due','Total balance'],r:r1,f:['Total','',tb,tp,tb-tp,tl]},
  {name:'Products sold',h:['Product','Quantity','Amount'],r:r2,f:['Total',r2.reduce((a,x)=>a+x[1],0),r2.reduce((a,x)=>a+x[2],0)]},
  {name:'All shopkeepers: balance due',h:['Shopkeeper','Phone','Balance due'],r:r3,f:['Total','',cb]}]}}
function toCSV(rep){const q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const o=[q(S.cfg.shop+' - '+rep.title)];rep.tables.forEach(t=>{o.push('');if(t.name)o.push(q(t.name));o.push(t.h.map(q).join(','));t.r.forEach(r=>o.push(r.map(q).join(',')));if(t.f)o.push(t.f.map(q).join(','))});return '\uFEFF'+o.join('\r\n')}
function toHTML(rep,paper){const f=v=>typeof v=='number'?M(v):esc(v),td=r=>r.map(v=>'<td'+(typeof v=='number'?' class="r"':'')+'>'+f(v)+'</td>').join('');

function blobDL(n,d,m){try{const u=URL.createObjectURL(new Blob([d],{type:m||'application/octet-stream'})),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}catch(e){return false}}
async function dlBin(name,data){let d=null;try{d=window.claude?await claude.use('downloads'):null}catch(e){}
 if(!d){if(!window.claude&&blobDL(name,data))return;return alert('Download is not available in this view')}try{await d.save({filename:name,data})}catch(e){if(!e||e.code!='declined')alert('Could not save the file')}}
async function exportXLSX(){try{await loadXLSX()}catch(e){return alert('Excel library could not load. Check internet and try again.')}
 const P=S.products,dates=[...new Set([...S.sales.map(x=>x.date),...S.pays.map(x=>x.date),...Object.keys(S.days),S.cur])].sort();
 const sd=d=>{const D=dayData(d);return D};
 const prods=[['Product','Price','Stock','Value'],...P.map(p=>[p.name,p.price,p.stock,p.price*p.stock])];
 const sal=[['Date','Shopkeeper','Items','Bill','Paid','Due'],...[...S.sales].sort((a,b)=>a.date>b.date?1:-1).map(x=>[x.date,cname(x.cust),x.items.map(i=>pname(i.pid)+' x'+i.qty).join(', '),x.total,x.paid,x.total-x.paid])];
 const stk=[['Date','Product','Sold','Remaining']];const sum=[['Date','Status','Bills','Units sold','Sales amount','Payments received','Stock remaining']];
 dates.forEach(d=>{const D=sd(d);P.forEach(p=>stk.push([d,p.name,D.sold[p.id]||0,D.rem?(D.rem[p.id]??0):'']));
  sum.push([d,d==S.cur?'Open':(S.days[d]?'Closed':''),D.ss.length,D.units,D.total,D.recv,D.rem?Object.values(D.rem).reduce((a,b)=>a+b,0):''])});
 const cu=[['Shopkeeper','Phone','Billed','Paid','Balance due']],led=[['Shopkeeper','Date','Details','Bill','Paid','Balance']];
 S.customers.forEach(c=>{const b=billsOf(c.id).reduce((a,x)=>a+x.total,0),pd=billsOf(c.id).reduce((a,x)=>a+x.paid,0)+paysOf(c.id).reduce((a,x)=>a+x.amt,0);cu.push([c.name,c.phone||'',b,pd,b-pd]);
  let run=0;[...billsOf(c.id).map(x=>({d:x.date,t:x.items.map(i=>pname(i.pid)+' x'+i.qty).join(', '),a:x.total,p:x.paid})),...paysOf(c.id).map(x=>({d:x.date,t:'Payment received',a:0,p:x.amt}))].sort((a,b)=>a.d>b.d?1:-1).forEach(e=>{run+=e.a-e.p;led.push([c.name,e.d,e.t,e.a,e.p,run])})});
 const pay=[['Date','Shopkeeper','Amount'],...S.pays.map(x=>[x.date,cname(x.cust),x.amt])];
 const wb=XLSX.utils.book_new();
 [['Daily Summary',sum],['Daily Stock',stk],['Daily Sales',sal],['Shopkeepers',cu],['Ledger',led],['Payments',pay],['Products',prods]].forEach(a=>{const w=XLSX.utils.aoa_to_sheet(a[1]);w['!cols']=a[1][0].map(()=>({wch:22}));XLSX.utils.book_append_sheet(wb,w,a[0])});
 dlBin('innovista-full-data-'+iso(new Date())+'.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}))}

 sure('Restore backup','All current data on this device will be replaced by the backup ('+j.products.length+' products, '+j.sales.length+' bills).',()=>{S=j;vd=S.cur;bill=null;save();draw()})};r.readAsText(f);el.value=''}
