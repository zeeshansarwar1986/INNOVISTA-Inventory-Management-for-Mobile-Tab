<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="theme-color" content="#e8502e"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>INNOVISTA Inventory Management</title>
<style>
:root, :root[data-theme="white"], :root[data-theme="light"]{
  --bg:#f1f1f3;
  --card:#ffffff;
  --tx:#14141a;
  --mu:#80808c;
  --pr:#e8502e;
  --pr2:#f7924f;
  --gr:#2e8b62;
  --rd:#d24545;
  --bd:#e7e7ec;
  --xl:#1d6f42;
  --xl2:#e8f3ec;
  --ln:#d6d9de;
  --rn:#f0f1f4;
  --card-shadow:0 2px 10px #0000000d;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="halfwhite"]{
  --bg:#ebe5d8;
  --card:#f8f5ee;
  --tx:#2c2824;
  --mu:#7d7468;
  --pr:#d94c2b;
  --pr2:#eb8948;
  --gr:#287a4a;
  --rd:#c83b3b;
  --bd:#ded4c3;
  --xl:#266842;
  --xl2:#eae3d4;
  --ln:#d5ccbc;
  --rn:#ebe3d4;
  --card-shadow:0 2px 10px #2a201010;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#101014;
  --card:#1b1b22;
  --tx:#f2f2f6;
  --mu:#9a9aa8;
  --pr:#e6421d;
  --pr2:#f7924f;
  --gr:#2e8b62;
  --rd:#d63232;
  --bd:#2b2b35;
  --xl:#20834e;
  --xl2:#18261e;
  --ln:#34343f;
  --rn:#24242c;
  --card-shadow:0 2px 10px #00000040;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="white"]):not([data-theme="halfwhite"]):not([data-theme="light"]){
    --bg:#101014;--card:#1b1b22;--tx:#f2f2f6;--mu:#9a9aa8;--bd:#2b2b35;--xl:#1f7a4a;--xl2:#18261e;--ln:#34343f;--rn:#24242c;--card-shadow:0 2px 10px #00000040;color-scheme:dark;
  }
}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:480px;margin:auto;padding:14px 14px 90px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--bd)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.grid .card{margin:0}
.big{font-size:22px;font-weight:700;margin-top:6px}.mu{color:var(--mu);font-size:13px}
.hero{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0}.hero .mu{color:#e6e9ff}
h2{margin:0 0 8px;font-size:17px}
button,input,select{font:inherit;color:var(--tx)}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);margin:4px 0 8px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--rd)}.btn.w{width:100%}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.bars{display:flex;gap:14px;align-items:flex-end;height:120px;margin-top:8px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mu)}
.bars i{display:block;border-radius:10px 10px 4px 4px;margin-top:4px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:50}
nav div{display:flex;max-width:480px;width:100%}nav button{flex:1;background:none;border:0;padding:12px 2px;color:var(--mu);font-size:12px;cursor:pointer}nav button.on{color:var(--pr);font-weight:700}
.bad{color:var(--rd)}.ok{color:var(--gr)}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:100}
#modal .box{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px;max-height:85vh;overflow:auto}
.lock{max-width:340px;margin:20vh auto;text-align:center}
.tg{display:flex;justify-content:space-between;align-items:center}

body{background:radial-gradient(900px 300px at 50% -80px,#e8502e22,transparent),var(--bg);min-height:100vh}
.card{box-shadow:var(--card-shadow, 0 2px 10px #0000000d);border-radius:16px}
.theme-box{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--bd);box-shadow:var(--card-shadow)}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.theme-card{border:2px solid var(--bd);background:var(--bg);border-radius:12px;padding:12px 6px;text-align:center;cursor:pointer;transition:transform .15s, border-color .15s, background .15s;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:3px;user-select:none}
.theme-card:active{transform:scale(0.96)}
.theme-card.active{border-color:var(--pr);background:var(--card);box-shadow:0 0 0 2px var(--pr)}
.theme-card .t-ic{font-size:26px;line-height:1.2}
.theme-card .t-nm{font-size:13px;font-weight:700}
.theme-card .t-desc{font-size:11px;color:var(--mu)}
.theme-card .t-tag{font-size:10px;font-weight:700;color:var(--pr);margin-top:2px}
.hero{box-shadow:0 8px 22px #e8502e40}
.sh{overflow-x:auto;border:1px solid var(--ln);border-radius:12px;background:var(--card);margin-bottom:12px}
table.sheet{border-collapse:collapse;width:100%;font-size:13px;min-width:100%}
table.sheet td,table.sheet th{border:1px solid var(--ln);padding:7px 8px;white-space:nowrap}
table.sheet tr.ab th{background:var(--rn);color:var(--mu);font-weight:400;font-size:11px;padding:2px;text-align:center}
table.sheet tr.hd th{background:var(--xl);color:#fff;font-weight:600;text-align:left}
table.sheet td.rn,table.sheet th.rn{background:var(--rn);color:var(--mu);text-align:center;width:30px;font-size:11px}
table.sheet tr:nth-child(even) td:not(.rn){background:var(--xl2)}
table.sheet td.r,table.sheet th.r{text-align:right;font-variant-numeric:tabular-nums}
table.sheet tr.ft td{font-weight:700;background:var(--rn)!important;border-top:2px solid var(--xl)}
table.sheet input{width:76px;margin:0;padding:4px 6px;border-radius:6px;text-align:right;background:var(--card);border:1px solid var(--pr)}
.ttl{display:flex;align-items:center;gap:8px;margin:4px 0 8px;font-weight:700}.ttl:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--pr)}
nav{box-shadow:0 -4px 18px #00000014}nav button span{display:block;font-size:19px;line-height:1.2}
nav button.on{color:var(--pr)}

.tile{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--bd);background:var(--bg);margin-top:10px;cursor:pointer}
.tile b{display:block}.tile .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#e8502e1f;flex:none}.tile .ch{margin-left:auto;color:var(--mu)}
.tile.danger{border-color:#d2454566}.tile.danger .ic{background:#d2454522}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;background:#d2454522;color:var(--rd);font-weight:600}
input[type=file]{padding:8px}textarea{background:var(--bg)}
html,body{overscroll-behavior-y:contain}#ptr{position:fixed;top:0;left:0;right:0;height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;color:var(--mu);font-size:13px;z-index:8;background:linear-gradient(var(--card),transparent)}#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:99px;font-size:13px;opacity:0;transition:.3s;z-index:110;pointer-events:none}#toast.on{opacity:.95}.arr{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--pr);cursor:pointer;font-size:13px;box-shadow:0 2px 8px #0000001a;transition:transform .3s}.arr.c{transform:rotate(180deg)}.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .35s ease}.fold.c{grid-template-rows:0fr}.fold>div{overflow:hidden;min-height:0}
@media(min-width:700px){body{font-size:16px}#app{max-width:860px;padding:22px 22px 100px}nav div{max-width:860px}.grid{grid-template-columns:repeat(3,1fr)}table.sheet{font-size:14.5px}table.sheet td,table.sheet th{padding:10px 14px}#modal{align-items:center}#modal .box{border-radius:20px;max-width:540px}.lock{margin-top:14vh}}
@media(min-width:1100px){#app{max-width:1120px}nav div{max-width:1120px}table.sheet{font-size:15px}}
@media(max-width:360px){.big{font-size:19px}table.sheet{font-size:12px}table.sheet td,table.sheet th{padding:6px}}
.sh{max-height:70vh;overflow:auto;-webkit-overflow-scrolling:touch}
table.sheet tr.ab th{position:sticky;top:0;z-index:3;height:20px;line-height:16px;background:var(--rn)}
table.sheet tr.hd th{position:sticky;top:20px;z-index:3}
table.sheet td.rn,table.sheet th.rn{position:sticky;left:0;z-index:2}
table.sheet tr.ab th:first-child,table.sheet tr.hd th.rn{z-index:4}
table.sheet tbody tr:hover td:not(.rn){background:#e8502e14!important}
table.sheet tr.ft td{position:sticky;bottom:0;z-index:2}
table.sheet input:focus{outline:2px solid var(--pr);outline-offset:0}
.ttl .arr{margin-left:auto;width:32px;height:32px}.ttl span{flex:1}.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 13px;font-size:13px;cursor:pointer}.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}@media(max-width:699px){#cbox table.sheet td,#cbox table.sheet th{padding:7px 5px;font-size:12.5px}#cbox table.sheet td:nth-child(2){white-space:normal;min-width:84px}}.acc{padding:12px 14px}.acc .accb{display:none;margin-top:12px}.acc.open .accb{display:block}.acch{display:flex;align-items:center;gap:12px;cursor:pointer;min-height:42px}.acch .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#e8502e1f;font-size:19px;flex:none}.acch b{flex:1;font-size:15px}.acch .ch{color:var(--mu);transition:transform .2s;font-size:20px}.acc.open .ch{transform:rotate(90deg)}.acc.open{border-color:var(--pr)}.admsub{margin:-4px 0 12px}</style></head><body>

// ---------- Theme & Brightness Management ----------
function getTheme(){
 return (S&&S.cfg&&S.cfg.theme)||localStorage.getItem('innovista_theme')||'white';
}
function applyTheme(t,silent){
 const theme=['white','halfwhite','dark'].includes(t)?t:'white';
 if(!S)S=def();
 if(!S.cfg)S.cfg={};
 S.cfg.theme=theme;
 try{localStorage.setItem('innovista_theme',theme)}catch(e){}
 document.documentElement.setAttribute('data-theme',theme);
 const meta=$('meta[name="theme-color"]');
 if(meta){meta.setAttribute('content',theme==='dark'?'#101014':(theme==='halfwhite'?'#ebe5d8':'#e8502e'))}
 if(!silent){
  save();
  const lbls={white:'☀️ وائٹ موڈ (White)',halfwhite:'🌤️ ہاف وائٹ موڈ (Half-White)',dark:'🌙 ڈارک موڈ (Dark Mode)'};
  toast((lbls[theme]||theme)+' فعال ہوگیا');
  draw();
 }
}
function toggleTheme(){
 const cur=getTheme();
 applyTheme(cur==='dark'?'white':'dark');
}
function themeBtn(){
 return '<button class="btn s" onclick="toggleTheme()" title="Theme / برائٹنس" style="padding:6px 10px;border-radius:20px;font-size:16px;cursor:pointer;line-height:1;display:inline-flex;align-items:center;justify-content:center">🌙</button>';
}

function dayData(d){
 const ss=S.sales.filter(s=>s.date==d),sold={};let units=0,total=0,recv=0;
 ss.forEach(s=>{total+=s.total;recv+=s.paid;s.items.forEach(i=>{sold[i.pid]=(sold[i.pid]||0)+i.qty;units+=i.qty})});
 S.pays.filter(p=>p.date==d).forEach(p=>recv+=p.amt);
 let rem;if(d==S.cur)rem=Object.fromEntries(S.products.map(p=>[p.id,p.stock]));else rem=(S.days[d]&&S.days[d].closing)||null;
 return{ss,sold,units,total,recv,rem}}

 const cards=[['sales',M(D.total),vd],['units',D.units,vd],['stock',remTotal==null?'No record':remTotal,'end of day'],['recv',M(D.recv),vd],['due',M(due),'all shopkeepers']].filter(x=>!h[x[0]]);
 let hi=0,nl=0,lo=0;if(D.rem)S.products.forEach(p=>{const q=D.rem[p.id]||0;q<=S.cfg.low?lo++:q<=S.cfg.near?nl++:hi++});

 return '<div class="tg"><div style="display:flex;align-items:center;gap:10px">'+logo(44)+'<div><h2 style="margin:0">'+esc(S.cfg.shop)+'</h2><div class="mu">'+esc(S.cfg.note)+'</div></div></div><div style="display:flex;align-items:center;gap:6px">'+themeBtn()+'<span class="mu">'+(vd==S.cur?'Open day':'Closed day')+'</span></div></div><br>'+
 '<input type="date" value="'+vd+'" onchange="vd=this.value||S.cur;draw()">'+
 '<div class="grid">'+cards.map((x,i)=>'<div class="card '+(i==0?'hero':'')+'"><div class="mu">'+esc(c[x[0]])+'</div><div class="big">'+x[1]+'</div><div class="mu">'+x[2]+'</div></div>').join('')+'</div>'+
 (h.stockinfo?'':'<div class="card"><h2>Stock info</h2><div class="mu">Active products</div><div class="big">'+S.products.length+'</div><div class="bars">'+
 [['High stock',hi,'#6e86ec'],['Near-low',nl,'#7fd3ee'],['Low stock',lo,'#b682d8']].map(b=>'<div>'+b[0]+'<br><b style="color:var(--tx);font-size:18px">'+b[1]+'</b><i style="height:'+(10+b[1]/mx*60)+'px;background:'+b[2]+'"></i></div>').join('')+'</div></div>')+

 '<div class="card"><h2>Bills on this date</h2>'+(D.ss.map(s=>'<div class="row"><span>'+esc(cname(s.cust))+'<br><span class="mu">'+s.items.map(i=>esc(pname(i.pid))+' x'+i.qty).join(', ')+'</span></span><span>'+M(s.total)+'</span></div>').join('')||'<div class="mu">No sales</div>')+'</div>'}

 if(!bill)bill={cust:'',items:[],paid:''};
 const opts='<option value="">Select shopkeeper</option>'+S.customers.map(c=>'<option value="'+c.id+'" '+(bill.cust==c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('');
 const tot=bill.items.reduce((a,i)=>a+i.qty*i.price,0);

 '<div class="card">'+(bill.items.map((i,k)=>'<div class="row"><span>'+esc(pname(i.pid))+' x '+i.qty+'</span><span>'+M(i.qty*i.price)+' <button class="btn s" onclick="bill.items.splice('+k+',1);draw()">x</button></span></div>').join('')||'<div class="mu">No items</div>')+
 '<br><button class="btn s" onclick="addItem()">+ Add item</button></div>'+
 '<div class="card"><div class="tg"><b>Bill total</b><b>'+M(tot)+'</b></div><label class="mu">Paid now</label><input type="number" value="'+bill.paid+'" oninput="bill.paid=this.value"><button class="btn w" onclick="saveBill()">Save bill</button></div>'}
function addItem(){if(!S.products.length)return form('No products',[],()=>true,'OK');
 form('Add item',[['p','Product','select',S.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+' (stock '+p.stock+')</option>').join('')],['q','Quantity','number','1']],v=>{
 const p=S.products.find(x=>x.id==v.p),q=+v.q;const used=bill.items.filter(i=>i.pid==p.id).reduce((a,i)=>a+i.qty,0);
 if(!q||q+used>p.stock){alert('Not enough stock');return false}bill.items.push({pid:p.id,qty:q,price:p.price});draw()},'Add')}
function saveBill(){
 if(!bill.cust||!bill.items.length){alert('Select shopkeeper and add items');return}
 const total=bill.items.reduce((a,i)=>a+i.qty*i.price,0);
 bill.items.forEach(i=>S.products.find(p=>p.id==i.pid).stock-=i.qty);
 S.sales.push({id:uid(),date:S.cur,cust:bill.cust,items:bill.items,total,paid:+bill.paid||0});bill=null;save();vd=S.cur;tab='dash';draw()}

function sheet(h,rows,foot,al){
 al=al||[];const a=i=>al[i]=='r'?' class="r"':'';
 let t='<div class="sh"><table class="sheet"><tr class="ab"><th></th>'+h.map((_,i)=>'<th>'+String.fromCharCode(65+i)+'</th>').join('')+'</tr><tr class="hd"><th class="rn">#</th>'+h.map((x,i)=>'<th'+a(i)+'>'+x+'</th>').join('')+'</tr>';
 rows.forEach((r,n)=>t+='<tr><td class="rn">'+(n+1)+'</td>'+r.map((c,i)=>'<td'+a(i)+'>'+c+'</td>').join('')+'</tr>');
 if(!rows.length)t+='<tr><td class="rn">1</td><td colspan="'+h.length+'" class="mu">No data</td></tr>';
 if(foot)t+='<tr class="ft"><td class="rn">Σ</td>'+foot.map((c,i)=>'<td'+a(i)+'>'+c+'</td>').join('')+'</tr>';
 return t+'</table></div>'}

 '<input type="date" value="'+vd+'" onchange="vd=this.value||S.cur;draw()">'+

// ---------- Reset center ----------
const tile=(ic,t,d,f,x)=>'<div class="tile '+(x||'')+'" onclick="'+f+'"><div class="ic">'+ic+'</div><div><b>'+t+'</b><span class="mu">'+d+'</span></div><span class="ch">›</span></div>';
function resetCard(){return '<div class="card"><div class="tg"><h2 style="margin:0">Reset center</h2><span class="pill">Danger zone</span></div><p class="mu" style="margin:6px 0 0">Delete records by date, month or everything. This cannot be undone.</p>'+
 tile('📅','Reset a date','Delete sales and payments of one day','rDate()')+tile('🗓️','Reset a month','Clear a full month of sales','rMonth()')+tile('⚠️','Reset entire app','Erase products, shopkeepers and all sales','rAll()','danger')+'</div>'}
function sure(t,msg,yes){modal('<h2>'+t+'</h2><p>'+msg+'</p><div style="display:flex;gap:8px"><button class="btn s w" onclick="close()">Cancel</button><button class="btn r w" id="yb">Yes, reset</button></div>');$('#yb').onclick=()=>{yes();close()}}
function rmRange(f){const rm=S.sales.filter(x=>f(x.date));
 rm.filter(x=>x.date==S.cur).forEach(x=>x.items.forEach(i=>{const p=S.products.find(q=>q.id==i.pid);if(p)p.stock+=i.qty}));
 S.sales=S.sales.filter(x=>!f(x.date));S.pays=S.pays.filter(x=>!f(x.date));
 Object.keys(S.days).forEach(d=>{if(f(d)&&d!=S.cur)delete S.days[d]});save();draw()}
function rDate(){form('Reset a date',[['d','Select date','date',vd]],v=>{if(!v.d)return false;
 const n=S.sales.filter(x=>x.date==v.d).length,m=S.pays.filter(x=>x.date==v.d).length;
 sure('Reset '+v.d,n+' bills and '+m+' payments will be deleted.'+(v.d==S.cur?' Stock of these bills returns to inventory.':''),()=>rmRange(d=>d==v.d));return false},'Next')}
function rMonth(){form('Reset a month',[['m','Select month','month',vd.slice(0,7)]],v=>{if(!v.m)return false;
 const n=S.sales.filter(x=>x.date.slice(0,7)==v.m).length,m=S.pays.filter(x=>x.date.slice(0,7)==v.m).length;

function parseCSV(t,sep){t=t.replace(/^\uFEFF/,'');const R=[];let r=[],c='',q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch=='"')q=true;else if(ch==sep){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))R.push(r);r=[]}else c+=ch}
 r.push(c);if(r.some(x=>x.trim()))R.push(r);return R}

function impFile(el){const f=el.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>impParse(String(rd.result));rd.readAsText(f);el.value=''}
function impParse(t){const first=t.split(/\r?\n/)[0]||'';const R=parseCSV(t,first.includes(';')&&!first.includes(',')?';':',');if(!R.length)return alert('Empty file');
 const h=R[0].map(x=>x.trim().toLowerCase());let ni=h.findIndex(x=>/name|product/.test(x)),pi=h.findIndex(x=>/price|rate/.test(x)),qi=h.findIndex(x=>/qty|quant|stock|count/.test(x)),ai=h.findIndex(x=>/amount|total/.test(x));
 let data=R.slice(1);if(ni<0||qi<0){ni=0;pi=1;qi=2;ai=3;data=R}
 pend=data.map(r=>{const qty=num(r[qi])||0;let price=pi>=0?num(r[pi]):NaN;const am=ai>=0?num(r[ai]):NaN;if(!(price>=0))price=(qty&&am>=0)?am/qty:0;return{name:(r[ni]||'').trim(),qty,price}}).filter(x=>x.name);
 if(!pend.length)return alert('No products found. Check the columns: Name, Price, Quantity, Amount');
 modal('<h2>Import '+pend.length+' products</h2><p class="mu">Prices are always updated. Matching is by product name. Choose how to treat quantity:</p><button class="btn w" onclick="applyImp(1)">Add quantity to current stock</button><br><br><button class="btn s w" onclick="applyImp(0)">Set quantity exactly (overwrite stock)</button><br><br><button class="btn s w" onclick="close()">Cancel</button>')}
function applyImp(add){pend.forEach(it=>{const p=S.products.find(x=>x.name.toLowerCase()==it.name.toLowerCase());if(p){p.price=it.price;p.stock=add?p.stock+it.qty:it.qty}else S.products.push({id:uid(),name:it.name,price:it.price,stock:it.qty})});pend=[];save();close();draw()}

function recalcInv(id){const p=S.products.find(x=>x.id==id),e=document.getElementById('v_'+id);if(e&&p)e.textContent=M(p.price*p.stock);let tv=0,tq=0;S.products.forEach(x=>{tv+=x.price*x.stock;tq+=x.stock});const a=document.getElementById('ftq'),b=document.getElementById('ftv');if(a)a.textContent=tq;if(b)b.textContent=M(tv)}
function setP(id,v,el){const p=S.products.find(x=>x.id==id);p.price=Math.max(0,+v||0);if(el)el.value=p.price;save();recalcInv(id)}
function setS(id,v,el){const p=S.products.find(x=>x.id==id);p.stock=Math.max(0,+v||0);if(el)el.value=p.stock;save();recalcInv(id)}
function pickMatches(){const q=(($('#ps')||{}).value||'').trim().toLowerCase();return S.products.filter(p=>!q||p.name.toLowerCase().includes(q))}

 $('#pl').innerHTML=sh.map(p=>'<div class="row" style="padding:10px;cursor:pointer;'+(p.id==pickId?'background:var(--xl2);':'')+(p.stock<=0?'opacity:.5;':'')+'" onclick="pickSel(\''+p.id+'\')"><span>'+esc(p.name)+'</span><span class="mu">'+M(p.price)+' | stock '+p.stock+'</span></div>').join('')+(L.length>60?'<div class="mu" style="padding:8px">'+(L.length-60)+' more, type to narrow down</div>':'')+(L.length?'':'<div class="mu" style="padding:10px">No match</div>')}

function pickAdd(){const p=S.products.find(x=>x.id==pickId);if(!p)return alert('Select a product from the list');const q=+$('#pq').value,used=bill.items.filter(i=>i.pid==p.id).reduce((a,i)=>a+i.qty,0);

 pickList();$('#pa').onclick=pickAdd;setTimeout(()=>{const e=$('#ps');if(e)e.focus()},60)}

// ---------- smart shopkeeper ledger ----------
let custQ='',custSort='due',custDue=false;
function custStats(c){const bs=billsOf(c.id),ps=paysOf(c.id),billed=bs.reduce((a,x)=>a+x.total,0),paid=bs.reduce((a,x)=>a+x.paid,0)+ps.reduce((a,x)=>a+x.amt,0);return{billed,paid,due:billed-paid,n:bs.length}}
function custSheet(){const q=custQ.trim().toLowerCase();
 let L=S.customers.map(c=>({c,s:custStats(c)})).filter(o=>(!q||o.c.name.toLowerCase().includes(q)||(o.c.phone||'').includes(q))&&(!custDue||o.s.due>0));
 L.sort(custSort=='az'?(a,b)=>a.c.name.localeCompare(b.c.name):(a,b)=>b.s.due-a.s.due);
 let td=0,tb=0;S.customers.forEach(c=>{const x=custStats(c);td+=x.due;tb+=x.billed});
 const rows=L.map(o=>['<a style="color:var(--pr);cursor:pointer;font-weight:600" onclick="sub=\''+o.c.id+'\';draw()">'+esc(o.c.name)+'</a>',o.c.phone?'<a href="tel:'+esc(o.c.phone)+'" style="color:inherit;text-decoration:none">'+esc(o.c.phone)+'</a>':'<span class="mu">-</span>','<b class="'+(o.s.due>0?'bad':'ok')+'">'+M(o.s.due)+'</b>',M(o.s.billed)]);
 return '<div class="mu" style="margin:0 0 6px">Showing '+L.length+' of '+S.customers.length+' shopkeepers. Tap a name to open the full account.</div>'+sheet(['Shopkeeper','Phone','Due','Sale'],rows,['Total (all)','',M(td),M(tb)],['l','l','r','r'])}
function editCust(id){const c=S.customers.find(x=>x.id==id);form('Edit shopkeeper',[['n','Name','text',c.name],['ph','Phone','tel',c.phone||'']],v=>{if(!v.n.trim())return false;c.name=v.n.trim();c.phone=v.ph.trim();save();draw()})}
function newBillFor(id){bill={cust:id,items:[],paid:''};sub=null;tab='sales';draw()}
function custs(){
 if(!sub){const dueN=S.customers.filter(c=>custStats(c).due>0).length,td=S.customers.reduce((a,c)=>a+custStats(c).due,0);
  const chip=(t,on,f)=>'<button class="chip'+(on?' on':'')+'" onclick="'+f+';draw()">'+t+'</button>';
  return '<div class="tg"><h2>Shopkeeper ledger</h2><div style="display:flex;gap:6px;align-items:center">'+themeBtn()+'<button class="btn" onclick="addCust()">+ Add</button></div></div>'+

  '<input type="search" id="cq" placeholder="Search name or phone..." autocomplete="off" value="'+esc(custQ)+'" oninput="custQ=this.value;$(\'#cbox\').innerHTML=custSheet()">'+
  '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">'+chip('Highest due',custSort=='due',"custSort='due'")+chip('A to Z',custSort=='az',"custSort='az'")+chip('With due only',custDue,'custDue=!custDue')+'</div><div id="cbox">'+custSheet()+'</div>'}
 const c=S.customers.find(x=>x.id==sub);if(!c){sub=null;return custs()}
 const ev=[...billsOf(sub).map(x=>({k:'b',id:x.id,d:x.date,t:x.items.map(i=>pname(i.pid)+' x'+i.qty).join(', '),a:x.total,p:x.paid})),...paysOf(sub).map(x=>({k:'p',id:x.id,d:x.date,t:'Payment received',a:0,p:x.amt}))].sort((a,b)=>a.d>b.d?1:-1);
 let run=0,ta=0,tp=0;const tx=ev.map(e=>{run+=e.a-e.p;ta+=e.a;tp+=e.p;return[e.d,esc(e.t),e.a?M(e.a):'',e.p?M(e.p):'',M(run),'<button class="btn s" style="padding:3px 9px" onclick="'+(e.k=='b'?'editBill':'editPay')+'(\''+e.id+'\')">Edit</button>']}).reverse();
 const byD={};ev.forEach(e=>{const o=byD[e.d]=byD[e.d]||{b:0,s:0,p:0};if(e.k=='b')o.b++;o.s+=e.a;o.p+=e.p});
 let r2=0,nb=0;const dw=Object.keys(byD).sort().map(d=>{const o=byD[d];r2+=o.s-o.p;nb+=o.b;return[d,o.b||'',o.s?M(o.s):'',o.p?M(o.p):'','<b class="'+(r2>0?'bad':'ok')+'">'+M(r2)+'</b>']}).reverse();
 const last=ev.length?ev[ev.length-1].d:'-';
 return '<div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn s" onclick="sub=null;draw()">Back</button><button class="btn s" onclick="editCust(\''+sub+'\')">Edit name or phone</button></div>'+
 '<div class="card hero"><div class="mu">'+esc(c.name)+(c.phone?' | <a href="tel:'+esc(c.phone)+'" style="color:#fff">'+esc(c.phone)+'</a>':'')+'</div><div class="big">Balance due '+M(ta-tp)+'</div></div>'+
 '<div class="grid"><div class="card"><div class="mu">Total sale</div><div class="big">'+M(ta)+'</div></div><div class="card"><div class="mu">Total received</div><div class="big ok">'+M(tp)+'</div></div><div class="card"><div class="mu">Bills</div><div class="big">'+nb+'</div></div><div class="card"><div class="mu">Last entry</div><div class="big" style="font-size:17px">'+last+'</div></div></div>'+
 '<div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn w" onclick="recv(\''+sub+'\')">Receive payment</button><button class="btn s w" onclick="newBillFor(\''+sub+'\')">New bill</button></div>'+
 secH('Date-wise account','foldLedDate')+'<div class="fold'+(S.cfg.foldLedDate?' c':'')+'"><div>'+sheet(['Date','Bills','Sale','Received','Balance'],dw,['Total',nb,M(ta),M(tp),M(ta-tp)],['l','r','r','r','r'])+'</div></div>'+
 secH('All entries (tap Edit to change)','foldLedTx')+'<div class="fold'+(S.cfg.foldLedTx?' c':'')+'"><div>'+sheet(['Date','Details','Bill','Paid','Balance',''],tx,['Total','',M(ta),M(tp),M(ta-tp),''],['l','l','r','r','r','l'])+'</div></div>'}

// ---------- password hashing, admin re-check, accordion admin ----------
const b64=a=>btoa(String.fromCharCode.apply(null,new Uint8Array(a)));
const hasSub=()=>!!(window.crypto&&crypto.subtle);
async function pwDerive(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:100000},k,256))}
async function setPw(pw){if(!hasSub()){S.cfg.pw=pw;delete S.cfg.pwh;save();return}const salt=b64(crypto.getRandomValues(new Uint8Array(16)));S.cfg.pws=salt;S.cfg.pwh=await pwDerive(pw,salt);delete S.cfg.pw;save()}
async function checkPw(pw){const c=S.cfg;if(c.pwh&&hasSub())return(await pwDerive(pw,c.pws))===c.pwh;if(c.pw!==undefined){const ok=pw===c.pw;if(ok&&hasSub())await setPw(pw);return ok}return false}
function openAdmin(){if(!S.cfg.lock){sub='admin';draw();return}
 form('Admin password',[['p','Enter the app password','password']],v=>{checkPw(v.p).then(ok=>{if(ok){sub='admin';draw()}else alert('Wrong password')});return true},'Open')}
const ICON={'Theme & Brightness / تھیم':'🌙','Theme & Brightness':'🌙','App lock':'🔐','Front page editor':'🎛️','Stock levels':'📉','Import products (CSV / Excel)':'📥','Reports and print':'🖨️','Data safety, Excel and Google Sheets':'💾','License':'🔑'};
function accordify(){const open=S.cfg.adm||'';
 document.querySelectorAll('#app>.card').forEach(c=>{const h=c.querySelector('h2');if(!h)return;const t=h.textContent;h.remove();
  const body=document.createElement('div');body.className='accb';while(c.firstChild)body.appendChild(c.firstChild);
  const hd=document.createElement('div');hd.className='acch';hd.innerHTML='<span class="ic">'+(ICON[t]||'⚙️')+'</span><b>'+t+'</b><span class="ch">›</span>';
  c.className='card acc'+(t==open?' open':'');c.appendChild(hd);c.appendChild(body);
  hd.onclick=()=>{const o=c.classList.contains('open');document.querySelectorAll('#app>.acc').forEach(x=>x.classList.remove('open'));if(!o)c.classList.add('open');S.cfg.adm=o?'':t;save()}});
 const h=document.querySelector('#app>h2');if(h)h.insertAdjacentHTML('afterend','<div class="mu admsub">Tap a section to open it.</div>')}
